services:
  postgres:
    image: postgres:16-alpine
    container_name: recychain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recychain
      POSTGRES_PASSWORD: recychain
      POSTGRES_DB: recychain
    ports:
      - "5432:5432"
    volumes:
      - recychain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recychain -d recychain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recychain_pgdata:
