[package]
name = "proof-of-recycling"
version = "0.2.0"
description = "River Algorithm — Proof of Recycling + REC minting on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proof_of_recycling"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
